name: DeepEval Tests

on:
  push:
    branches: [main, master]
    paths:
      - 'deepeval-tests/**'
      - 'llm-multiroute/**'
      - '.github/workflows/deepeval-tests-ci.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'deepeval-tests/**'
      - 'llm-multiroute/**'
      - '.github/workflows/deepeval-tests-ci.yml'
  workflow_dispatch:

env:
  OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
  OLLAMA_BASE_URL: ${{ secrets.OLLAMA_BASE_URL }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

jobs:
  deepeval:
    name: DeepEval LLM Evaluation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: deepeval-tests/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r deepeval-tests/requirements.txt

      - name: Verify CI secrets
        run: |
          missing=0
          for name in OLLAMA_API_KEY OLLAMA_BASE_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required secret or env: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Configure DeepEval judge
        working-directory: deepeval-tests
        run: |
          deepeval set-ollama \
            --model=deepseek-v4.1-flash \
            --base-url="${OLLAMA_BASE_URL:-https://ollama.com}" \
            --save=dotenv

      - name: Build and start backend
        run: docker compose up -d llm-multiroute

      - name: Wait for backend to be ready
        run: |
          echo "Waiting for backend to be ready..."
          for i in $(seq 1 36); do
            if curl -sf http://localhost:8080/api/ai/routes > /dev/null; then
              if curl -sf -X POST http://localhost:8080/api/ai/classify \
                -H 'Content-Type: application/json' \
                -d '{"text":"health check"}' > /dev/null; then
                echo "Backend and classify endpoint are ready."
                exit 0
              fi
            fi
            echo "Attempt $i/36 - backend not ready yet..."
            sleep 10
          done
          echo "Backend failed to start."
          docker compose logs llm-multiroute
          exit 1

      - name: Run all DeepEval tests
        working-directory: deepeval-tests
        run: |
          rm -rf .deepeval
          deepeval test run \
            test_classify.py \
            test_sentiment.py \
            test_summarize.py \
            test_intent.py \
            -v

      - name: Tear down backend
        if: always()
        run: docker compose down
